# Render Blueprint — deploys the Marginalia API.
#
# In Render: New → Blueprint → pick this repository → Apply.
#
# Render generates both JWT secrets itself and asks you for exactly one value:
# MONGODB_URI. Everything else has a working default.
#
# Render has no managed MongoDB, so the database lives on MongoDB Atlas
# (the free M0 tier is far more than one reader needs).
# Full walkthrough: server/README.md#deploying-to-render

services:
  - type: web
    name: marginalia-api
    runtime: node
    plan: free
    region: oregon          # or frankfurt / singapore / ohio / virginia
    rootDir: server
    # --include=dev is load-bearing: NODE_ENV=production below applies to the
    # build too, and npm skips devDependencies when it is set — so a plain
    # `npm ci` leaves out the Nest CLI and the build dies with "nest: not
    # found". The compiled output needs none of it at runtime.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main

    # Render waits for this to return 200 before routing traffic to a new
    # deploy, so a bad build never replaces a working one.
    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: 20.20.1

      - key: NODE_ENV
        value: production

      # Generated once by Render, never shown in git or in a log.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # The one thing Render will prompt you for.
      # mongodb+srv://user:password@cluster0.xxxxx.mongodb.net/marginalia?retryWrites=true&w=majority
      - key: MONGODB_URI
        sync: false

# ---------------------------------------------------------------------------
# Deliberately not listed above, so the blueprint only asks you for one thing.
# All of these are optional; add them in the Render dashboard later if wanted.
#
#   JWT_ACCESS_TTL          default 30m
#   JWT_REFRESH_TTL         default 60d
#   CORS_ORIGINS            leave unset — a phone sends no Origin header, so
#                           empty means "the app only", which is right when the
#                           only client is an APK. Set it only if a website
#                           ever needs to call this API.
#   GOOGLE_BOOKS_API_KEY    only raises the rate limit on the metadata fallback
# ---------------------------------------------------------------------------
