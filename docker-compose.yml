# Everything the backend needs, in one command:
#   docker compose up --build
#
# The mobile app does not need any of this to run — it is local-first and
# works offline forever. This exists so the journal can be backed up and
# carried to a new phone.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # Not published to the host by default — only the API talks to it.
    # Uncomment to poke around with a GUI:
    # ports:
    #   - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/marginalia
      # Override these in a .env file next to this compose file.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET — try: openssl rand -base64 48}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET — try: openssl rand -base64 48}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-30m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-60d}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/auth/google/callback}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
    ports:
      - "4000:4000"

volumes:
  mongo-data:
